services:
  # ── Node.js Express Backend ─────────────────────────────────────────────────
  - type: web
    name: goldcraft-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false          # set in Render dashboard
      - key: JWT_SECRET
        sync: false          # set in Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OCR_SERVICE_URL
        value: https://goldcraft-ocr.onrender.com
